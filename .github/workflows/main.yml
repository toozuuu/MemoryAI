name: Main Branch CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Build, Test & Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check Monorepo
        run: npm run typecheck

      - name: Run Full Test Suite (89 Tests)
        run: npm test

      - name: Build Monorepo Artifacts
        run: npm run build

      - name: Validate Modular AI Skill Registry
        run: node ./cli/dist/bin.js skills validate

      - name: Run 14-Point Diagnostic Self-Test (Doctor)
        run: node ./cli/dist/bin.js doctor

      - name: Run Automated Security Test Suite (OWASP Top 10)
        run: npm run test:security

      - name: Audit NPM Dependencies
        run: npm audit --audit-level=high

      - name: Verify Docker Container Build
        run: |
          docker build -t memoryai:ci -f infra/docker/Dockerfile .
