services:
  memoryai-api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    container_name: memoryai-api
    restart: always
    environment:
      - NODE_ENV=production
      - MEMORYAI_DATA_DIR=/var/lib/memoryai
      - MEMORYAI_LOG_LEVEL=warn
      - PORT=3000
    volumes:
      - memoryai_prod_data:/var/lib/memoryai
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health/live"]
      interval: 15s
      timeout: 3s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  nginx:
    image: nginx:alpine
    container_name: memoryai-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - memoryai-api
    security_opt:
      - no-new-privileges:true

volumes:
  memoryai_prod_data:
    driver: local
